# Mosquitto 2.x configuration for FLP
# Mosquitto 2.x rejects anonymous connections by default — must opt in.

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
connection_messages true

# Disable persistence to avoid volume permission issues in Docker
persistence false

# Log to stdout so `docker compose logs mosquitto` works
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Tuning for file-transfer workloads (many small QoS-1 fragments)
max_queued_messages 5000
max_inflight_messages 40
max_packet_size 1048576

# WebSocket listener for Cloudflare Tunnel (MQTT over WSS)
listener 9001 0.0.0.0
protocol websockets
