<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Link Protocol — Dashboard</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ════════════════ Navigation Rail ═════���══════════ -->
<nav class="nav-rail">
  <div class="brand">FLP</div>

  <a class="nav-item active" data-tab="topology">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    </div>
    <span class="label">Topology</span>
  </a>

  <a class="nav-item" data-tab="metrics">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
    </div>
    <span class="label">Metrics</span>
  </a>

  <a class="nav-item" data-tab="transfers">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </div>
    <span class="label">Transfers</span>
  </a>

  <a class="nav-item" data-tab="memory">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M15 9H9v6h6V9zm-2 4h-2v-2h2v2zm8-2V9h-2V7c0-1.1-.9-2-2-2h-2V3h-2v2h-2V3H9v2H7c-1.1 0-2 .9-2 2v2H3v2h2v2H3v2h2v2c0 1.1.9 2 2 2h2v2h2v-2h2v2h2v-2h2c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2zm-4 6H7V7h10v10z"/></svg>
    </div>
    <span class="label">Memory</span>
  </a>

  <a class="nav-item" data-tab="messaging">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
    </div>
    <span class="label">Messaging</span>
  </a>
</nav>

<!-- ════════════════ Main Content ════════════════ -->
<div class="main">
  <div class="top-bar">
    <h1>Forest Link Protocol</h1>
    <span class="subtitle">Mesh Network Dashboard</span>
  </div>
  <div class="content">

    <!-- ════ Topology ════ -->
    <div id="topology" class="panel active">
      <div class="stat-grid" id="topo-stats"></div>
      <div id="topo-container"></div>
    </div>

    <!-- ════ Metrics ════ -->
    <div id="metrics" class="panel">
      <div class="controls">
        <select class="m3-select" id="node-select"><option value="">Select node...</option></select>
        <select class="m3-select" id="range-select">
          <option value="300">5 min</option>
          <option value="3600" selected>1 hour</option>
          <option value="86400">24 hours</option>
        </select>
        <button class="m3-btn" onclick="loadMetrics()">Refresh</button>
      </div>
      <div class="chart-wrap"><canvas id="metrics-chart"></canvas></div>
    </div>

    <!-- ════ Transfers ════ -->
    <div id="transfers" class="panel">
      <div id="active-transfer" style="margin-bottom:20px;display:none;">
        <div class="section-title">Active Transfer</div>
        <div class="stat-grid" id="active-stats"></div>
        <div class="m3-progress-track">
          <div class="m3-progress-fill" id="active-bar" style="width:0%"></div>
        </div>
      </div>
      <div class="section-title">Transfer History</div>
      <div class="stat-grid" id="transfer-stats"></div>
      <div class="m3-table-wrap">
        <table>
          <thead><tr><th>Session</th><th>Timestamp</th><th>Size</th><th>Chunks</th><th>Duration</th><th>Goodput</th><th>Retransmits</th></tr></thead>
          <tbody id="transfer-body"></tbody>
        </table>
      </div>
    </div>

    <!-- ════ Memory ════ -->
    <div id="memory" class="panel">
      <div class="controls">
        <select class="m3-select" id="heap-node-select"><option value="">Select node...</option></select>
        <select class="m3-select" id="heap-range-select">
          <option value="300">5 min</option>
          <option value="3600" selected>1 hour</option>
          <option value="86400">24 hours</option>
        </select>
        <button class="m3-btn" onclick="loadHeap()">Refresh</button>
        <button class="m3-btn-tonal" onclick="sendNodeCmd(document.getElementById('heap-node-select').value, 1)">Request Telemetry</button>
      </div>
      <div class="stat-grid" id="heap-stats"></div>
      <div class="chart-wrap"><canvas id="heap-chart"></canvas></div>
    </div>

    <!-- ════ Messaging ════ -->
    <div id="messaging" class="panel">
      <div class="section-title">Send Message to Node</div>
      <div class="controls">
        <select class="m3-select" id="msg-node-select"><option value="FFFF">Broadcast (0xFFFF)</option></select>
        <input class="m3-input" id="msg-topic" type="text" placeholder="Topic (e.g. msg)" style="width:140px;">
      </div>
      <div style="display:flex; gap:12px; margin-bottom:20px;">
        <div style="flex:1;">
          <div style="font-size:12px; color:#8C9388; margin-bottom:6px; text-transform:uppercase; font-weight:500;">Plain Text</div>
          <input class="m3-input" id="msg-text" type="text" placeholder="Enter message text (e.g. Hello)" style="width:100%;">
        </div>
        <div style="flex:1;">
          <div style="font-size:12px; color:#8C9388; margin-bottom:6px; text-transform:uppercase; font-weight:500;">Or Hex Data</div>
          <input class="m3-input" id="msg-payload" type="text" placeholder="Enter hex data (e.g. 48656C6C6F)" style="width:100%;">
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button class="m3-btn" onclick="sendTopicMsg()" style="height:40px;">Send</button>
        </div>
      </div>
      <div class="section-title">Message Log</div>
      <div class="msg-log" id="msg-log"></div>
    </div>

  </div>
</div>

<!-- ════════════════ Scripts ════════════════ -->
<script src="js/helpers.js"></script>
<script>
/* Navigation Rail — Tab switching */
document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
        item.classList.add('active');
        document.getElementById(item.dataset.tab).classList.add('active');
        if (item.dataset.tab === 'transfers') loadTransfers();
        if (item.dataset.tab === 'memory') loadHeap();
    });
});
</script>
<script src="js/topology.js"></script>
<script src="js/metrics.js"></script>
<script src="js/transfers.js"></script>
<script src="js/heap.js"></script>
<script src="js/messaging.js"></script>
<script src="js/commands.js"></script>
</body>
</html>
