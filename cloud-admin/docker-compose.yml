services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  admin:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - ./received_files:/app/received_files
      - flp-db:/app/data
    depends_on:
      - mosquitto
    environment:
      - FLP_WEB_PORT=5050
    restart: unless-stopped

volumes:
  flp-db:
