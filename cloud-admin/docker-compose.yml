services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "0.0.0.0:1883:1883"
      - "0.0.0.0:9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u $${MQTT_ADMIN_USER:-flp-admin} -P $${MQTT_ADMIN_PASS} -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s
    environment:
      - MQTT_ADMIN_USER=flp-admin
      - MQTT_ADMIN_PASS=${MQTT_ADMIN_PASS}
    restart: unless-stopped

  admin:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - ./received_files:/app/received_files
      - flp-db:/app
    depends_on:
      mosquitto:
        condition: service_healthy
    command: ["--broker", "mosquitto", "--port", "1883", "--mqtt-user", "flp-admin", "--mqtt-pass", "${MQTT_ADMIN_PASS}"]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flp-db:
