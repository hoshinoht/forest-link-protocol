services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "0.0.0.0:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  admin:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - ./received_files:/app/received_files
      - flp-db:/app
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flp-db:
