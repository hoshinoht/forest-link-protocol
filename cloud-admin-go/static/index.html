<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLP v3.7 — Dashboard</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; }
header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
header h1 { font-size: 18px; color: #58a6ff; }
header span { font-size: 12px; color: #8b949e; }
.tabs { display: flex; background: #161b22; border-bottom: 1px solid #30363d; }
.tab { padding: 10px 20px; cursor: pointer; color: #8b949e; border-bottom: 2px solid transparent; font-size: 14px; }
.tab:hover { color: #c9d1d9; }
.tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
.panel { display: none; padding: 20px; height: calc(100vh - 100px); overflow: auto; }
.panel.active { display: block; }
#topo-container { width: 100%; height: calc(100vh - 160px); background: #0d1117; border: 1px solid #30363d; border-radius: 6px; }
.controls { margin-bottom: 12px; display: flex; gap: 12px; align-items: center; }
select, button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 4px; font-size: 13px; }
button:hover { background: #30363d; cursor: pointer; }
.chart-wrap { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 16px; max-width: 900px; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #21262d; font-size: 13px; }
th { color: #8b949e; font-weight: 600; }
tr:hover { background: #161b22; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 14px; }
.stat-card .label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
.stat-card .value { font-size: 22px; font-weight: 600; color: #58a6ff; margin-top: 4px; }
.online { color: #3fb950; }
.offline { color: #f85149; }
</style>
</head>
<body>
<header>
    <h1>Forest Link Protocol</h1>
    <span>v3.7 — Mesh Network Dashboard</span>
</header>
<div class="tabs">
    <div class="tab active" data-tab="topology">Topology</div>
    <div class="tab" data-tab="metrics">Node Metrics</div>
    <div class="tab" data-tab="transfers">Transfers</div>
    <div class="tab" data-tab="memory">Memory</div>
    <div class="tab" data-tab="messaging">Messaging</div>
    <div class="tab" data-tab="comparison">Comparison</div>
</div>

<div id="topology" class="panel active">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <div class="stat-grid" id="topo-stats" style="flex:1;margin-bottom:0;"></div>
        <button id="crawl-btn" onclick="crawlMesh()">Crawl Mesh</button>
    </div>
    <div id="topo-container"></div>
</div>

<div id="metrics" class="panel">
    <div class="controls">
        <select id="node-select"><option value="">Select node...</option></select>
        <select id="range-select">
            <option value="300">5 min</option>
            <option value="3600" selected>1 hour</option>
            <option value="86400">24 hours</option>
        </select>
        <button onclick="loadMetrics()">Refresh</button>
    </div>
    <div class="chart-wrap"><canvas id="metrics-chart"></canvas></div>
</div>

<div id="transfers" class="panel">
    <div id="active-transfer" style="margin-bottom:16px;display:none;">
        <div class="stat-grid" id="active-stats"></div>
        <div style="background:#21262d;border-radius:4px;height:20px;margin-top:8px;">
            <div id="active-bar" style="background:#58a6ff;height:100%;border-radius:4px;transition:width 0.3s;width:0%"></div>
        </div>
    </div>
    <div class="stat-grid" id="transfer-stats"></div>
    <table>
        <thead><tr><th>Session</th><th>Size</th><th>Chunks</th><th>Duration</th><th>Goodput</th><th>Retransmits</th></tr></thead>
        <tbody id="transfer-body"></tbody>
    </table>
</div>

<div id="memory" class="panel">
    <div class="controls">
        <select id="heap-node-select"><option value="">Select node...</option></select>
        <select id="heap-range-select">
            <option value="300">5 min</option>
            <option value="3600" selected>1 hour</option>
            <option value="86400">24 hours</option>
        </select>
        <button onclick="loadHeap()">Refresh</button>
        <button onclick="sendNodeCmd(document.getElementById('heap-node-select').value, 1)">Request Telemetry</button>
    </div>
    <div class="stat-grid" id="heap-stats"></div>
    <div class="chart-wrap"><canvas id="heap-chart"></canvas></div>
</div>

<div id="messaging" class="panel">
    <div class="controls">
        <select id="msg-node-select"><option value="FFFF">Broadcast (0xFFFF)</option></select>
        <input id="msg-topic" type="text" placeholder="Topic (e.g. config)" style="background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:4px;font-size:13px;width:160px;">
        <input id="msg-payload" type="text" placeholder="Payload hex (optional)" style="background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:4px;font-size:13px;width:200px;">
        <button onclick="sendTopicMsg()">Send</button>
    </div>
    <div id="msg-log" style="margin-top:16px;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:16px;font-family:monospace;font-size:13px;max-height:400px;overflow:auto;"></div>
</div>

<div id="comparison" class="panel">
    <div class="chart-wrap" style="max-width:100%">
        <canvas id="compare-pdr"></canvas>
    </div>
    <div class="chart-wrap" style="max-width:100%">
        <canvas id="compare-throughput"></canvas>
    </div>
    <div class="chart-wrap" style="max-width:100%">
        <canvas id="compare-latency"></canvas>
    </div>
</div>

<script>
// --- Helpers for safe DOM manipulation ---
function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
}

function createStatCard(label, value, cssClass) {
    const card = document.createElement('div');
    card.className = 'stat-card';
    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.textContent = label;
    const valueEl = document.createElement('div');
    valueEl.className = 'value' + (cssClass ? ' ' + cssClass : '');
    valueEl.textContent = value;
    card.appendChild(labelEl);
    card.appendChild(valueEl);
    return card;
}

function createTransferRow(t) {
    const tr = document.createElement('tr');
    const cells = [
        t.session_id.substring(0, 8) + '...',
        (t.size_bytes / 1024).toFixed(1) + ' KB',
        String(t.chunks),
        (t.end - t.start).toFixed(1) + 's',
        (t.goodput_bps / 1000).toFixed(2) + ' kbps',
        String(t.retransmits)
    ];
    cells.forEach(text => {
        const td = document.createElement('td');
        td.textContent = text;
        tr.appendChild(td);
    });
    return tr;
}

// --- Tab switching ---
document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.getElementById(t.dataset.tab).classList.add('active');
        if (t.dataset.tab === 'comparison') loadComparison();
        if (t.dataset.tab === 'transfers') loadTransfers();
        if (t.dataset.tab === 'memory') loadHeap();
    });
});

// --- Topology ---
const network = new vis.Network(
    document.getElementById('topo-container'),
    { nodes: new vis.DataSet(), edges: new vis.DataSet() },
    {
        nodes: { shape: 'dot', size: 18, font: { color: '#c9d1d9', size: 12 } },
        edges: { color: { color: '#30363d', highlight: '#58a6ff' }, font: { color: '#8b949e', size: 10, align: 'top' }, arrows: { to: false } },
        physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -80, springLength: 120 } },
        interaction: { hover: true }
    }
);
const topoNodes = network.body.data.nodes;
const topoEdges = network.body.data.edges;

async function pollTopology() {
    try {
        const r = await fetch('/api/topology');
        const data = await r.json();
        const nodeIds = new Set();
        const edgeIds = new Set();

        let online = 0, offline = 0;
        data.nodes.forEach(n => {
            nodeIds.add(n.id);
            const color = n.status === 'online' ? '#3fb950' : '#f85149';
            const label = n.id + '\n' + n.status;
            let title = n.id + ' (' + n.status + ')';
            if (n.heap) {
                title += '\nPSRAM: ' + (n.heap.free_psram / 1024).toFixed(0) + ' KB free';
                title += '\nSRAM: ' + (n.heap.free_internal / 1024).toFixed(0) + ' KB free';
                title += '\nMin PSRAM: ' + (n.heap.min_psram / 1024).toFixed(0) + ' KB';
                title += '\nLargest block: ' + (n.heap.largest_block / 1024).toFixed(0) + ' KB';
            }
            if (topoNodes.get(n.id)) {
                topoNodes.update({ id: n.id, label, title, color: { background: color, border: color } });
            } else {
                topoNodes.add({ id: n.id, label, title, color: { background: color, border: color } });
            }
            if (n.status === 'online') online++; else offline++;
            // Populate node selectors
            ['node-select', 'heap-node-select', 'msg-node-select'].forEach(selId => {
                const sel = document.getElementById(selId);
                if (!sel.querySelector('option[value="' + n.id + '"]')) {
                    const opt = document.createElement('option');
                    opt.value = n.id;
                    opt.textContent = n.id;
                    sel.appendChild(opt);
                }
            });
        });

        data.edges.forEach(e => {
            const eid = [e.source, e.target].sort().join('-');
            edgeIds.add(eid);
            const label = e.rssi + 'dBm ' + e.transport;
            const edgeColor = e.transport === 'BLE' ? '#58a6ff' : '#d2a8ff';
            if (topoEdges.get(eid)) {
                topoEdges.update({ id: eid, from: e.source, to: e.target, label, color: { color: edgeColor } });
            } else {
                topoEdges.add({ id: eid, from: e.source, to: e.target, label, color: { color: edgeColor } });
            }
        });

        // Remove stale
        topoNodes.getIds().forEach(id => { if (!nodeIds.has(id)) topoNodes.remove(id); });
        topoEdges.getIds().forEach(id => { if (!edgeIds.has(id)) topoEdges.remove(id); });

        const statsEl = document.getElementById('topo-stats');
        clearChildren(statsEl);
        statsEl.appendChild(createStatCard('Nodes Online', online, 'online'));
        statsEl.appendChild(createStatCard('Nodes Offline', offline, 'offline'));
        statsEl.appendChild(createStatCard('Links', data.edges.length, ''));
    } catch (e) { /* silent */ }
}
setInterval(pollTopology, 5000);
pollTopology();

// --- Node Metrics ---
let metricsChart = null;
async function loadMetrics() {
    const nodeId = document.getElementById('node-select').value;
    const range = document.getElementById('range-select').value;
    if (!nodeId) return;
    const r = await fetch('/api/metrics/' + encodeURIComponent(nodeId) + '?range=' + range);
    const data = await r.json();
    if (metricsChart) metricsChart.destroy();

    const bleData = data.filter(d => d.transport === 'BLE');
    const loraData = data.filter(d => d.transport === 'LoRa');
    const labels = bleData.map(d => new Date(d.timestamp * 1000).toLocaleTimeString());

    metricsChart = new Chart(document.getElementById('metrics-chart'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'BLE TX', data: bleData.map(d => d.tx), borderColor: '#58a6ff', tension: 0.3 },
                { label: 'BLE RX', data: bleData.map(d => d.rx), borderColor: '#3fb950', tension: 0.3 },
                { label: 'BLE Fail', data: bleData.map(d => d.fail), borderColor: '#f85149', tension: 0.3 },
                { label: 'LoRa TX', data: loraData.map(d => d.tx), borderColor: '#d2a8ff', borderDash: [5,3], tension: 0.3 },
                { label: 'LoRa Fail', data: loraData.map(d => d.fail), borderColor: '#f0883e', borderDash: [5,3], tension: 0.3 },
                { label: 'BLE Latency (ms)', data: bleData.map(d => d.latency_ms), borderColor: '#8b949e', yAxisID: 'y1', tension: 0.3 },
            ]
        },
        options: {
            responsive: true,
            plugins: { legend: { labels: { color: '#c9d1d9' } } },
            scales: {
                x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
                y: { position: 'left', ticks: { color: '#8b949e' }, grid: { color: '#21262d' }, title: { display: true, text: 'Packets', color: '#8b949e' } },
                y1: { position: 'right', ticks: { color: '#8b949e' }, grid: { drawOnChartArea: false }, title: { display: true, text: 'Latency (ms)', color: '#8b949e' } }
            }
        }
    });
}

// --- Transfers ---
async function loadTransfers() {
    const r = await fetch('/api/transfers');
    const data = await r.json();
    const tbody = document.getElementById('transfer-body');
    clearChildren(tbody);
    let totalBytes = 0;
    data.forEach(t => {
        totalBytes += t.size_bytes;
        tbody.appendChild(createTransferRow(t));
    });
    const statsEl = document.getElementById('transfer-stats');
    clearChildren(statsEl);
    statsEl.appendChild(createStatCard('Total Transfers', data.length, ''));
    statsEl.appendChild(createStatCard('Total Data', (totalBytes / 1024 / 1024).toFixed(2) + ' MB', ''));
    const avgGoodput = data.length ? (data.reduce((s, t) => s + t.goodput_bps, 0) / data.length / 1000).toFixed(2) : '0';
    statsEl.appendChild(createStatCard('Avg Goodput', avgGoodput + ' kbps', ''));
}

// --- Comparison ---
let cmpCharts = [];
async function loadComparison() {
    const r = await fetch('/api/comparison');
    const data = await r.json();
    cmpCharts.forEach(c => c.destroy());
    cmpCharts = [];
    if (!data.length) return;

    const names = data.map(d => d.name);
    const colors = ['#58a6ff','#3fb950','#d2a8ff','#f0883e','#f85149','#8b949e'];
    const bgColors = names.map((_, i) => colors[i % colors.length]);

    function makeBar(canvasId, label, values, unit) {
        const ctx = document.getElementById(canvasId);
        const c = new Chart(ctx, {
            type: 'bar',
            data: { labels: names, datasets: [{ label: label + (unit ? ' (' + unit + ')' : ''), data: values, backgroundColor: bgColors }] },
            options: {
                responsive: true, indexAxis: 'y',
                plugins: { legend: { labels: { color: '#c9d1d9' } } },
                scales: { x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }, y: { ticks: { color: '#c9d1d9' }, grid: { color: '#21262d' } } }
            }
        });
        cmpCharts.push(c);
    }
    makeBar('compare-pdr', 'PDR', data.map(d => d.pdr * 100), '%');
    makeBar('compare-throughput', 'Throughput', data.map(d => d.throughput_bps / 1000), 'kbps');
    makeBar('compare-latency', 'Latency', data.map(d => d.latency_ms), 'ms');
}

// --- Memory / Heap ---
let heapChart = null;
async function loadHeap() {
    const nodeId = document.getElementById('heap-node-select').value;
    const range = document.getElementById('heap-range-select').value;
    if (!nodeId) return;
    const r = await fetch('/api/heap/' + encodeURIComponent(nodeId) + '?range=' + range);
    const data = await r.json();
    if (heapChart) heapChart.destroy();
    if (!data.length) return;

    const labels = data.map(d => new Date(d.timestamp * 1000).toLocaleTimeString());

    // Show latest stats as cards
    const latest = data[data.length - 1];
    const statsEl = document.getElementById('heap-stats');
    clearChildren(statsEl);
    statsEl.appendChild(createStatCard('Free PSRAM', (latest.free_psram / 1024).toFixed(0) + ' KB', ''));
    statsEl.appendChild(createStatCard('Free SRAM', (latest.free_internal / 1024).toFixed(0) + ' KB', ''));
    statsEl.appendChild(createStatCard('Min PSRAM', (latest.min_psram / 1024).toFixed(0) + ' KB', ''));
    statsEl.appendChild(createStatCard('Min SRAM', (latest.min_internal / 1024).toFixed(0) + ' KB', ''));
    statsEl.appendChild(createStatCard('Largest Block', (latest.largest_block / 1024).toFixed(0) + ' KB', ''));

    heapChart = new Chart(document.getElementById('heap-chart'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'Free PSRAM (KB)', data: data.map(d => d.free_psram / 1024), borderColor: '#58a6ff', tension: 0.3 },
                { label: 'Free SRAM (KB)', data: data.map(d => d.free_internal / 1024), borderColor: '#3fb950', tension: 0.3 },
                { label: 'Min PSRAM (KB)', data: data.map(d => d.min_psram / 1024), borderColor: '#58a6ff', borderDash: [5,3], tension: 0.3 },
                { label: 'Min SRAM (KB)', data: data.map(d => d.min_internal / 1024), borderColor: '#3fb950', borderDash: [5,3], tension: 0.3 },
                { label: 'Largest Block (KB)', data: data.map(d => d.largest_block / 1024), borderColor: '#d2a8ff', tension: 0.3 },
            ]
        },
        options: {
            responsive: true,
            plugins: { legend: { labels: { color: '#c9d1d9' } } },
            scales: {
                x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
                y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' }, title: { display: true, text: 'KB', color: '#8b949e' } }
            }
        }
    });
}

// --- Topic Messaging ---
async function sendTopicMsg() {
    const nodeId = document.getElementById('msg-node-select').value;
    const topic = document.getElementById('msg-topic').value.trim();
    if (!topic) { alert('Topic is required'); return; }
    const payloadHex = document.getElementById('msg-payload').value.trim();
    const r = await fetch('/api/topic_msg/' + encodeURIComponent(nodeId), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic: topic, data: payloadHex })
    });
    const data = await r.json();
    const log = document.getElementById('msg-log');
    const ts = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    const status = data.ok ? ' OK' : ' ERR: ' + (data.error || 'unknown');
    entry.textContent = '[' + ts + '] -> 0x' + nodeId + ' topic="' + topic + '"'
        + (payloadHex ? ' data=' + payloadHex : '') + status;
    log.insertBefore(entry, log.firstChild);
}

// --- Active Transfer Progress ---
async function pollActiveTransfer() {
    try {
        const r = await fetch('/api/active-transfer');
        const d = await r.json();
        const wrap = document.getElementById('active-transfer');
        if (!d.active) {
            wrap.style.display = 'none';
            return;
        }
        wrap.style.display = 'block';
        const statsEl = document.getElementById('active-stats');
        clearChildren(statsEl);
        statsEl.appendChild(createStatCard('File', d.filename, ''));
        statsEl.appendChild(createStatCard('Progress', (d.progress * 100).toFixed(1) + '%', ''));
        statsEl.appendChild(createStatCard('Chunks', d.received + ' / ' + d.chunk_count, ''));
        statsEl.appendChild(createStatCard('Size', (d.total_size / 1024).toFixed(1) + ' KB', ''));
        statsEl.appendChild(createStatCard('Elapsed', d.elapsed_sec.toFixed(1) + 's', ''));
        document.getElementById('active-bar').style.width = (d.progress * 100).toFixed(1) + '%';
    } catch (e) { /* silent */ }
}
setInterval(pollActiveTransfer, 2000);
pollActiveTransfer();

// --- Crawl Mesh ---
async function crawlMesh() {
    const btn = document.getElementById('crawl-btn');
    btn.disabled = true;
    btn.textContent = 'Crawling...';
    try {
        const r = await fetch('/api/crawl');
        const d = await r.json();
        btn.textContent = 'Pinged ' + d.nodes_pinged + ' nodes';
        setTimeout(() => { btn.textContent = 'Crawl Mesh'; btn.disabled = false; }, 3000);
    } catch (e) {
        btn.textContent = 'Error';
        setTimeout(() => { btn.textContent = 'Crawl Mesh'; btn.disabled = false; }, 3000);
    }
}

// --- Node Commands ---
async function sendNodeCmd(nodeId, cmdId) {
    const r = await fetch('/api/cmd/' + encodeURIComponent(nodeId), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd: cmdId })
    });
    const data = await r.json();
    if (data.ok) {
        console.log('Command sent:', data);
    }
}
</script>
</body>
</html>
